# Publishes the app (the built offline copy in app/) to GitHub Pages:
#   https://zaq6184-cell.github.io/green-zone-mo-guide/
# It runs on every push to main that changes app/ or this file, and by hand from the Actions tab.
# The site is public, so pushing a new build to main publishes it: ask Krishna before every push.
name: Publish the app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages workflow. On 21 Nov 2026 the upload and the deploy ran in one
# job, and the deploy asked for the upload a third of a second after it was finalised and found none ("No
# artifacts named github-pages were found"); its re-run failed the same way. A separate deploy job
# starts only once the build job has finished, when the run lists its artifact. If the deploy
# still fails, it waits a minute and tries once more.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
